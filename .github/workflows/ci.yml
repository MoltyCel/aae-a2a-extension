name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Conformance vectors are cloned at a pinned commit, not vendored.
      AAE_VECTORS_REPO: https://github.com/MoltyCel/aae-conformance-vectors
      AAE_VECTORS_COMMIT: 2f117799c604f258e67d5c13d69fea63881bdae0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.txt
      - name: Fetch conformance vectors
        run: |
          git init -q "$RUNNER_TEMP/vectors"
          git -C "$RUNNER_TEMP/vectors" fetch -q --depth 1 "$AAE_VECTORS_REPO" "$AAE_VECTORS_COMMIT"
          git -C "$RUNNER_TEMP/vectors" checkout -q FETCH_HEAD
          echo "AAE_VECTORS_DIR=$RUNNER_TEMP/vectors" >> "$GITHUB_ENV"
      - name: Tests
        run: python -m pytest -q
      - name: Demo
        run: python -m aae_a2a.demo
      - name: Cross-run, reference against reference
        run: VENV="$(dirname "$(dirname "$(command -v python)")")" scripts/crossrun-local.sh
      - name: Pinned bundle, fixed clock
        run: |
          (cd tests/vectors/crossrun/pinned && sha256sum -c --quiet MANIFEST.sha256)
          python -m aae_a2a.crossrun serve --port 8792 --pinned tests/vectors/crossrun/pinned &
          pid=$!
          for i in $(seq 1 50); do curl -fs http://127.0.0.1:8792/.well-known/agent-card.json >/dev/null && break; sleep 0.2; done
          rc=0; python -m aae_a2a.crossrun client --url http://127.0.0.1:8792 --pinned tests/vectors/crossrun/pinned || rc=$?
          kill "$pid"; exit "$rc"
      - name: Reported cross-runs
        run: |
          shopt -s nullglob
          files=(); for f in crossruns/*.json; do case "$(basename "$f")" in TEMPLATE*.json) ;; *) files+=("$f") ;; esac; done
          if [ ${#files[@]} -gt 0 ]; then python -m aae_a2a.crossrun check "${files[@]}"; else echo "no reported runs yet"; fi
